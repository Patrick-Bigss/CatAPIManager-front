<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cat Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="icon" type="image/png"
        href="https://t4.ftcdn.net/jpg/10/71/87/67/360_F_1071876754_hmAjWdR8Z3IWj2uHlTaBpW55f2Saykwb.jpg">
</head>

</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1"> 🐱 Cat Manager </span>
        </div>
    </nav>


    <div class="container mt-5">

        <div class="text-center mb-4">
            <h1>🐱 Cat Manager</h1>
            <p class="text-muted"> Sistema de gerenciamento de gato </p>
        </div>


        <div class="card shadow-sm mb-4">

            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Cadastrar Gato</h5>
            </div>

            <div class="card-body">

                <form>

                    <div class="row">

                        <div class="col-md-5 mb-3">

                            <label for="nome" class="form-label"> Nome </label>

                            <input type="text" class="form-control" id="nome" placeholder="Digite o nome">

                        </div>


                        <div class="col-md-5 mb-3">

                            <label for="raca" class="form-label"> Raça </label>

                            <input type="text" class="form-control" id="raca" placeholder="Digite a raça">

                        </div>


                        <div class="col-md-2 mb-3">

                            <label for="idade" class="form-label"> Idade </label>

                            <input ype="number"class="form-control" id="idade" placeholder="Digite a idade">

                        </div>

                    </div>

                    <div class="text-center">
                            <button type="submit" class="btn btn-success"> 🐱 Cadastrar Gato </button>
                    </div>

                </form>

            </div>

        </div>


        <div class="card shadow-sm">

            <div class="card-header bg-dark text-white">
                <h5 class="mb-0 text-center"> Gatos cadastrados </h5>
            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-striped table-hover align-middle">

                        <thead class="table-dark">

                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Raça</th>
                                <th>Idade</th>
                                <th>Ações</th>
                            </tr>

                        </thead>


                        <tbody>

                            <tr>

                                <td>1</td>

                                <td>Mimi</td>

                                <td>Siamês</td>

                                <td>3 anos</td>

                                <td>

                                    <button
                                        class="btn btn-primary btn-sm"
                                    >
                                        ✏️ Editar
                                    </button>

                                    <button
                                        class="btn btn-danger btn-sm"
                                    >
                                        🗑️ Excluir
                                    </button>

                                </td>

                            </tr>


                            <tr>

                                <td>2</td>

                                <td>Thor</td>

                                <td>Persa</td>

                                <td>5 anos</td>

                                <td>

                                    <button
                                        class="btn btn-primary btn-sm"
                                    >
                                        ✏️ Editar
                                    </button>

                                    <button
                                        class="btn btn-danger btn-sm"
                                    >
                                        🗑️ Excluir
                                    </button>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>


        <div class="text-center mt-4 mb-5">

            <button
                class="btn btn-dark btn-lg"
            >
                🐱 Buscar gato aleatório
            </button>

        </div>


        <div
            id="resultadoGato"
            class="text-center mb-5">

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/script.js"></script>
</body>

</html>
