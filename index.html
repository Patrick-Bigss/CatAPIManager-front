<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cat Manager</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-dark mb-4">

        <div class="container">

            <span class="navbar-brand mb-0 h1">
                🐱 Cat Manager
            </span>

        </div>

    </nav>


    <div class="container">

        <!-- TÍTULO -->

        <div class="text-center mb-4">

            <h1>🐱 Gerenciador de Gatos</h1>

            <p class="text-muted">
                Cadastre, consulte e descubra gatos através da The Cat API.
            </p>

        </div>


        <!-- ============================= -->
        <!-- CADASTRO -->
        <!-- ============================= -->

        <div class="card shadow-sm mb-4">

            <div class="card-header bg-dark text-white">

                <h4 class="mb-0">
                    Cadastro de Gato
                </h4>

            </div>


            <div class="card-body">

                <form>

                    <div class="row">

                        <!-- ID -->

                        <div class="col-md-3 mb-3">

                            <label
                                for="inputId"
                                class="form-label"
                            >
                                ID
                            </label>

                            <input
                                type="number"
                                id="inputId"
                                class="form-control"
                                placeholder="ID do gato"
                            >

                        </div>


                        <div class="col-md-9 mb-3">

                            <label
                                for="inputName"
                                class="form-label"
                            >
                                Nome
                            </label>

                            <input
                                type="text"
                                id="inputName"
                                class="form-control"
                                placeholder="Nome do gato"
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label
                                for="inputTemperament"
                                class="form-label"
                            >
                                Temperamento
                            </label>

                            <input
                                type="text"
                                id="inputTemperament"
                                class="form-control"
                                placeholder="Ex: Active, Energetic"
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label
                                for="inputOrigin"
                                class="form-label"
                            >
                                Origem
                            </label>

                            <input
                                type="text"
                                id="inputOrigin"
                                class="form-control"
                                placeholder="Ex: Egypt"
                            >

                        </div>


                        <div class="col-12 mb-3">

                            <label
                                for="inputDescription"
                                class="form-label"
                            >
                                Descrição
                            </label>

                            <textarea
                                id="inputDescription"
                                class="form-control"
                                rows="4"
                                placeholder="Descrição do gato"
                            ></textarea>

                        </div>

                    </div>

                    <div class="d-flex flex-wrap gap-2">

                        <button
                            type="button"
                            class="btn btn-success"
                            onclick="cadastrarGATO()"
                        >
                            ➕ Cadastrar
                        </button>


                        <button
                            type="button"
                            class="btn btn-primary"
                            onclick="gatoAtualizar()"
                        >
                            ✏️ Atualizar
                        </button>


                        <button
                            type="button"
                            class="btn btn-info"
                            onclick="gatoPorId()"
                        >
                            🔎 Buscar por ID
                        </button>


                        <button
                            type="button"
                            class="btn btn-danger"
                            onclick="GatoExcluir()"
                        >
                            🗑️ Excluir
                        </button>


                        <button
                            type="button"
                            class="btn btn-dark"
                            onclick="buscarGato()"
                        >
                            📋 Listar gatos
                        </button>

                    </div>

                </form>

            </div>

        </div>


        <div class="card shadow-sm mb-4">

            <div class="card-header bg-warning">

                <h4 class="mb-0">
                    🐱 Gato Aleatório
                </h4>

            </div>


            <div class="card-body text-center">

                <p class="text-muted">
                    Busque um gatinho aleatório
                </p>


                <button
                    type="button"
                    class="btn btn-warning"
                    onclick="buscarGatoAleatorio()"
                >
                    🎲 Buscar gato aleatório
                </button>


                <div id="resultadoGato"></div>

            </div>

        </div>

        <div class="card shadow-sm mb-4">

            <div class="card-header bg-dark text-white">

                <h4 class="mb-0">
                    📋 Gatos cadastrados
                </h4>

            </div>


            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-striped table-hover align-middle">

                        <thead class="table-dark">

                            <tr>

                                <th>ID</th>

                                <th>Nome</th>

                                <th>Temperamento</th>

                                <th>Origem</th>

                                <th>Descrição</th>

                                <th>Imagem</th>

                            </tr>

                        </thead>


                        <tbody>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>


        <div class="card shadow-sm mb-5">

            <div class="card-header">

                <h4 class="mb-0">
                    💻 Resposta da API
                </h4>

            </div>


            <div class="card-body">

                <pre
                    id="telaResposta"
                    class="bg-dark text-white p-3 rounded"
                ></pre>

            </div>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>



    <script src="/JS/🟨 script.js"></script>

</body>

</html>
