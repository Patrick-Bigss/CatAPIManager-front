<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🐱 Cat Manager</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>

    <!-- ==========================================
         CONTAINER PRINCIPAL
    =========================================== -->

    <div class="container mt-5 mb-5">


        <!-- ==========================================
             TÍTULO
        =========================================== -->

        <div class="text-center mb-4">

            <h1>
                🐱 CAT MANAGER
            </h1>

            <p class="text-muted">
                Sistema de gerenciamento de gatos
            </p>

        </div>


        <!-- ==========================================
             FORMULÁRIO DE CADASTRO
        =========================================== -->

        <div class="card shadow mb-4">

            <div class="card-header bg-dark text-white">

                <h5 class="mb-0 text-center">
                    Cadastrar Gato
                </h5>

            </div>


            <div class="card-body">

                <form id="formGato">

                    <div class="row">


                        <!-- NOME -->

                        <div class="col-md-3 mb-3">

                            <label
                                for="inputNome"
                                class="form-label"
                            >
                                Nome
                            </label>

                            <input
                                type="text"
                                id="inputNome"
                                class="form-control"
                                placeholder="Digite o nome do gato"
                            >

                        </div>


                        <!-- RAÇA -->

                        <div class="col-md-3 mb-3">

                            <label
                                for="inputRaca"
                                class="form-label"
                            >
                                Raça
                            </label>

                            <input
                                type="text"
                                id="inputRaca"
                                class="form-control"
                                placeholder="Digite a raça do gato"
                            >

                        </div>


                        <!-- COR -->

                        <div class="col-md-3 mb-3">

                            <label
                                for="inputCor"
                                class="form-label"
                            >
                                Cor
                            </label>

                            <input
                                type="text"
                                id="inputCor"
                                class="form-control"
                                placeholder="Digite a cor do gato"
                            >

                        </div>


                        <!-- IDADE -->

                        <div class="col-md-3 mb-3">

                            <label
                                for="inputIdade"
                                class="form-label"
                            >
                                Idade
                            </label>

                            <input
                                type="number"
                                id="inputIdade"
                                class="form-control"
                                placeholder="Idade"
                            >

                        </div>

                    </div>


                    <!-- BOTÃO CADASTRAR -->

                    <div class="text-center">

                        <button
                            type="button"
                            class="btn btn-success"
                            onclick="fazerPOST()"
                        >
                            🐱 Cadastrar Gato
                        </button>

                    </div>

                </form>

            </div>

        </div>


        <!-- ==========================================
             ÁREA DE OPERAÇÕES POR ID
        =========================================== -->

        <div class="card shadow mb-4">

            <div class="card-header bg-secondary text-white">

                <h5 class="mb-0 text-center">
                    Operações por ID
                </h5>

            </div>


            <div class="card-body">

                <div class="row">


                    <!-- ID -->

                    <div class="col-md-4 mb-3">

                        <label
                            for="inputId"
                            class="form-label"
                        >
                            ID do gato
                        </label>

                        <input
                            type="number"
                            id="inputId"
                            class="form-control"
                            placeholder="Digite o ID"
                        >

                    </div>


                    <!-- BOTÕES -->

                    <div class="col-md-8 d-flex align-items-end gap-2 mb-3">

                        <button
                            type="button"
                            class="btn btn-primary"
                            onclick="fazerGETPorId()"
                        >
                            🔍 Buscar
                        </button>


                        <button
                            type="button"
                            class="btn btn-warning"
                            onclick="fazerPUT()"
                        >
                            ✏️ Atualizar
                        </button>


                        <button
                            type="button"
                            class="btn btn-danger"
                            onclick="fazerDELETE()"
                        >
                            🗑️ Excluir
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- ==========================================
             TABELA DE GATOS
        =========================================== -->

        <div class="card shadow mb-4">

            <div class="card-header bg-dark text-white">

                <h5 class="mb-0 text-center">
                    Gatos cadastrados
                </h5>

            </div>


            <div class="card-body p-4">

                <div class="table-responsive">

                    <table
                        class="table table-striped table-hover align-middle"
                    >

                        <thead class="table-dark">

                            <tr>

                                <th class="text-center py-3">
                                    ID
                                </th>

                                <th class="py-3">
                                    Nome
                                </th>

                                <th class="py-3">
                                    Raça
                                </th>

                                <th class="py-3">
                                    Cor
                                </th>

                                <th class="text-center py-3">
                                    Idade
                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            <!--
                                Os gatos serão adicionados
                                automaticamente pelo JS.
                            -->

                        </tbody>

                    </table>

                </div>


                <!-- BOTÃO ATUALIZAR LISTA -->

                <div class="text-center">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        onclick="fazerGET()"
                    >
                        🔄 Atualizar lista
                    </button>

                </div>

            </div>

        </div>


        <!-- ==========================================
             GATO ALEATÓRIO
        =========================================== -->

        <div class="card shadow mb-4">

            <div class="card-header bg-dark text-white">

                <h5 class="mb-0 text-center">
                    🐱 Gato aleatório
                </h5>

            </div>


            <div class="card-body text-center">

                <button
                    type="button"
                    class="btn btn-dark btn-lg"
                    onclick="buscarGatoAleatorio()"
                >
                    🐱 Buscar gato aleatório
                </button>


                <div
                    id="resultadoGato"
                    class="mt-4"
                >

                </div>

            </div>

        </div>


        <!-- ==========================================
             RESPOSTA DA API
        =========================================== -->

        <div class="card shadow">

            <div class="card-header bg-secondary text-white">

                <h5 class="mb-0 text-center">
                    Resposta da API
                </h5>

            </div>


            <div class="card-body">

                <pre
                    id="telaResposta"
                    class="bg-light p-3"
                ></pre>

            </div>

        </div>


    </div>


   
    <script src="js/script.js"></script>

</body>

</html>
